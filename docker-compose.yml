services:
  postgres:
    image: postgres:15
    container_name: tablemind_db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tablemind"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    container_name: tablemind_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
    entrypoint: /bin/sh
    command: 
      - "-c"
      - |
        ollama serve &
        sleep 5
        echo "Checking for model $${OLLAMA_MODEL}..."
        if ! ollama list | grep -q "$${OLLAMA_MODEL}"; then
          echo "Model $${OLLAMA_MODEL} not found. Pulling..."
          ollama pull $${OLLAMA_MODEL}
        fi
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q $${OLLAMA_MODEL}"]
      interval: 10s
      timeout: 10s
      retries: 50

  backend:
    build:
      context: ./server
    container_name: tablemind_server
    env_file: .env
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      python seed.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./client
    container_name: tablemind_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
  ollama_data:
